<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一个用于验证 ChatGPT 创建与发布网页能力的在线测试页。">
  <title>ChatGPT 在线测试页</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070a12;
      color: #f7f8fb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(82, 121, 255, .28), transparent 32%),
        radial-gradient(circle at 85% 78%, rgba(93, 232, 192, .18), transparent 35%),
        #070a12;
    }
    main {
      width: min(680px, 100%);
      padding: clamp(28px, 7vw, 64px);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 28px;
      background: rgba(14, 19, 33, .72);
      box-shadow: 0 30px 90px rgba(0,0,0,.45);
      backdrop-filter: blur(18px);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      border: 1px solid rgba(108, 240, 197, .24);
      border-radius: 999px;
      color: #98f3d5;
      background: rgba(55, 196, 151, .08);
      font-size: .875rem;
      font-weight: 650;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #62e4bb;
      box-shadow: 0 0 16px #62e4bb;
    }
    h1 {
      margin: 28px 0 14px;
      max-width: 540px;
      font-size: clamp(2.35rem, 7vw, 4.6rem);
      line-height: .98;
      letter-spacing: -.055em;
    }
    p {
      margin: 0;
      color: #b7bfd0;
      font-size: 1.05rem;
      line-height: 1.75;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin-top: 34px;
    }
    button {
      min-height: 48px;
      padding: 0 20px;
      border: 0;
      border-radius: 14px;
      color: #07110e;
      background: #78edc7;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(83, 229, 183, .2); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    #result { color: #d8ddea; font-size: .95rem; }
    footer {
      margin-top: 48px;
      color: #70798c;
      font-size: .82rem;
    }
    @media (max-width: 520px) {
      main { border-radius: 22px; }
      .actions { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <div class="status"><span class="dot" aria-hidden="true"></span>网页已成功上线</div>
    <h1>你好，互联网。</h1>
    <p>这是由 ChatGPT 创建的在线测试页。点击下面的按钮，确认页面交互也能正常工作。</p>
    <div class="actions">
      <button id="test-button" type="button">测试一下</button>
      <span id="result" aria-live="polite">等待测试</span>
    </div>
    <footer>mws100 / ChatGPT · 在线网页测试</footer>
  </main>
  <script>
    const button = document.querySelector('#test-button');
    const result = document.querySelector('#result');
    let count = 0;
    button.addEventListener('click', () => {
      count += 1;
      result.textContent = `测试成功 · 已点击 ${count} 次`;
    });
  </script>
</body>
</html>
